name: Publish Grape Ai custom Docker image

# Publica a imagem da Grape a partir da branch `custom`.
# Tags: `:custom` (sempre a última da branch) e `:<versão>-grape-<sha curto>`
# (imutável, é a que se fixa no Coolify e se usa no rollback). Não publica `:latest`.

on:
  push:
    branches:
      - custom
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Igual ao build FOSS oficial: a Grape roda só a edição MIT.
      - name: Strip enterprise code
        run: |
          rm -rf enterprise
          rm -rf spec/enterprise
          echo -en '\nENV CW_EDITION="ce"' >> docker/Dockerfile

      - name: Compute image tags
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION_CW)
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          IMAGE="${REGISTRY}/${IMAGE_NAME,,}"
          echo "IMAGE_TAGS<<EOF" >> "$GITHUB_ENV"
          echo "${IMAGE}:custom" >> "$GITHUB_ENV"
          echo "${IMAGE}:${VERSION}-grape-${SHORT_SHA}" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ env.IMAGE_TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
