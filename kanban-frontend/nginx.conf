server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Support for React Router (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers to allow being embedded in Chatwoot (Iframe)
    # Note: We remove X-Frame-Options DENY to allow embedding
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    
    # Optional: If you know your Chatwoot domain, you can restrict it here
    # add_header Content-Security-Policy "frame-ancestors 'self' *.chatwoot.com *.reengenhariadigital.com.br;";

    # Cache control for static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
