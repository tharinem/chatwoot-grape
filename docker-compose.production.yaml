# Chatwoot Fork - Production Docker Compose
# Modified from upstream to build from source instead of pulling pre-built image.
# See UPSTREAM_DIFF.md for fork divergence documentation.
# Original: https://github.com/chatwoot/chatwoot/blob/develop/docker-compose.production.yaml

version: '3'

services:
  base: &base
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        RAILS_ENV: production
        NODE_ENV: production
    env_file: .env
    volumes:
      - storage_data:/app/storage
    restart: always

  rails:
    <<: *base
    depends_on:
      - postgres
      - redis
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']

  sidekiq:
    <<: *base
    depends_on:
      - postgres
      - redis
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']

  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=chatwoot_production
      - POSTGRES_USER=chatwoot
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?required}

  redis:
    image: redis:7-alpine
    restart: always
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?required}']
    volumes:
      - redis_data:/data

volumes:
  storage_data:
  postgres_data:
  redis_data:
