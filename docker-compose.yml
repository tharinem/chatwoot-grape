services:
  db:
    image: postgres:16-alpine
    container_name: kanban-db
    restart: always
    environment:
      POSTGRES_USER: grapeuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: kanbandb
    volumes:
      - kanban_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grapeuser -d kanbandb"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: ${DOCKER_IMAGE_API:-kanban-api:latest}
    build:
      context: ./kanban-api
      dockerfile: Dockerfile
    container_name: kanban-api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://grapeuser:${POSTGRES_PASSWORD}@db:5432/kanbandb
      CHATWOOT_URL: ${CHATWOOT_URL}
      NODE_ENV: production
      PORT: 3001
    expose:
      - "3001"

  frontend:
    image: ${DOCKER_IMAGE_FRONTEND:-kanban-frontend:latest}
    build:
      context: ./kanban-frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL}
    container_name: kanban-frontend
    restart: always
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  kanban_data:
