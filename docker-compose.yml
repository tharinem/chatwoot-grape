services:
  db:
    image: postgres:16-alpine
    container_name: kanban-db
    restart: always
    environment:
      POSTGRES_USER: grapeuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: kanbandb
    volumes:
      - kanban_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grapeuser -d kanbandb"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: ${DOCKER_IMAGE_API:-kanban-api:latest}
    build:
      context: ./kanban-api
      dockerfile: Dockerfile
    container_name: kanban-api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://grapeuser:${POSTGRES_PASSWORD}@db:5432/kanbandb
      CHATWOOT_URL: ${CHATWOOT_URL}
      NODE_ENV: production
      PORT: 3001
    expose:
      - "3001"

  # The Kanban frontend now lives in its own repository to keep this
  # Chatwoot fork lean. Deployed independently by Coolify.
  #   Repo: https://github.com/tharinem/grape-kanban-frontend
  #   Prod: https://kanban.grapeai.com.br
  # To run locally:
  #   git clone https://github.com/tharinem/grape-kanban-frontend
  #   cd grape-kanban-frontend && npm install && npm run dev

volumes:
  kanban_data:
